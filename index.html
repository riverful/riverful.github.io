<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.Case — riverful</title>
    <meta name="description" content="Jeremy's personal page. Software engineer & maker.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fff;
            color: #1a1a1a;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 32px;
        }

        .name {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.5px;
            line-height: 1.2;
            margin-bottom: 24px;
            color: #1a1a1a;
        }

        .name span {
            color: #999;
            font-weight: 400;
        }

        .bio {
            font-size: 16px;
            color: #555;
            line-height: 1.7;
            margin-bottom: 48px;
            max-width: 520px;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .links a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid #e5e5e5;
            border-radius: 100px;
            text-decoration: none;
            color: #333;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .links a:hover {
            border-color: #1a1a1a;
            background: #1a1a1a;
            color: #fff;
        }

        .links a svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .links a:hover svg path {
            fill: #fff;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: #e5e5e5;
            margin: 48px 0;
        }

        .footer {
            font-size: 13px;
            color: #bbb;
        }

        @media (max-width: 480px) {
            .container {
                padding: 48px 20px;
            }

            .name {
                font-size: 24px;
            }

            .avatar {
                width: 56px;
                height: 56px;
                font-size: 20px;
            }

            .bio {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">J</div>

        <h1 class="name">J.Case. <span>Software Engineer</span></h1>

        <p class="bio">
            I build things that work — from APIs and automation tools to personal dashboards.
            Interested in clean code, smart home, and making everyday life a little more efficient.
        </p>

        <div class="links">
            <a href="https://github.com/riverful" target="_blank" rel="noopener">

                GitHub
            </a>
            <a href="mailto:riverful@gmail.com">
                <svg viewBox="0 0 24 24" fill="none"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Email
            </a>
        </div>

        <div class="divider"></div>

        <p class="footer">&copy; 2026 J.Case</p>
    </div>
</body>
</html>
